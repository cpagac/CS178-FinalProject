<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bedrock Chat &mdash; Claude 3 Haiku on EKS</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
      color: #1a1a1a;
    }

    header {
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 14px 24px;
      display: flex;
      align-items: baseline;
      gap: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }

    header span {
      font-size: 0.8rem;
      color: #8899bb;
    }

    #chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 72%;
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: #e4e6eb;
      color: #1a1a1a;
      border-bottom-left-radius: 4px;
    }

    .message.error {
      align-self: flex-start;
      background: #fee2e2;
      color: #991b1b;
      border-bottom-left-radius: 4px;
      font-size: 0.875rem;
    }

    #input-bar {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
      background: #fff;
      border-top: 1px solid #d1d5db;
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      resize: none;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.4;
      outline: none;
      transition: border-color 0.15s;
      max-height: 140px;
      overflow-y: auto;
    }

    #user-input:focus {
      border-color: #2563eb;
    }

    #send-btn {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      white-space: nowrap;
    }

    #send-btn:hover:not(:disabled) {
      background: #1d4ed8;
    }

    #send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .typing-indicator {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 12px 14px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9ca3af;
      animation: bounce 1.2s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-6px); }
    }
  </style>
</head>
<body>

<header>
  <h1>Bedrock Chat</h1>
  <span>Claude 3 Haiku on EKS</span>
</header>

<div id="chat-window"></div>

<div id="input-bar">
  <textarea
    id="user-input"
    rows="1"
    placeholder="Type a message..."
    autofocus
  ></textarea>
  <button id="send-btn">Send</button>
</div>

<script>
  // -- Configuration ----------------------------------------------------------
  const BACKEND_URL = "REPLACE_WITH_LOADBALANCER_URL";
  // ---------------------------------------------------------------------------

  const chatWindow = document.getElementById("chat-window");
  const userInput  = document.getElementById("user-input");
  const sendBtn    = document.getElementById("send-btn");

  // Auto-grow textarea
  userInput.addEventListener("input", () => {
    userInput.style.height = "auto";
    userInput.style.height = Math.min(userInput.scrollHeight, 140) + "px";
  });

  // Send on Enter (Shift+Enter = newline)
  userInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener("click", sendMessage);

  function appendMessage(role, text) {
    const div = document.createElement("div");
    div.classList.add("message", role);
    div.textContent = text;
    chatWindow.appendChild(div);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return div;
  }

  function showTyping() {
    const wrapper = document.createElement("div");
    wrapper.classList.add("message", "assistant", "typing-indicator");
    for (let i = 0; i < 3; i++) {
      const dot = document.createElement("span");
      dot.classList.add("dot");
      wrapper.appendChild(dot);
    }
    chatWindow.appendChild(wrapper);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return wrapper;
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    appendMessage("user", text);

    userInput.value = "";
    userInput.style.height = "auto";

    sendBtn.disabled   = true;
    userInput.disabled = true;

    const typingEl = showTyping();

    try {
      const response = await fetch(BACKEND_URL + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });

      typingEl.remove();

      if (!response.ok) {
        const err = await response.text();
        appendMessage("error", "Error " + response.status + ": " + err);
      } else {
        const data = await response.json();
        const reply = data.response || data.message || JSON.stringify(data);
        appendMessage("assistant", reply);
      }
    } catch (err) {
      typingEl.remove();
      appendMessage("error", "Network error: " + err.message);
    } finally {
      sendBtn.disabled   = false;
      userInput.disabled = false;
      userInput.focus();
    }
  }
</script>

</body>
</html>
