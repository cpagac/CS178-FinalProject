apiVersion: apps/v1
kind: Deployment
metadata:
  name: bedrock-chat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bedrock-chat
  template:
    metadata:
      labels:
        app: bedrock-chat
    spec:
      containers:
      - name: bedrock-chat
        image: 451978385657.dkr.ecr.us-east-1.amazonaws.com/bedrock-chat:latest
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: anthropic-secret
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
